name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # No display on the runners. The tests build real psiexperiment
      # contexts, which need the Qt application but no windows.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # sounddevice's Linux wheel, unlike the Windows one, doesn't include
      # PortAudio.
      - name: Install the libraries Qt and sounddevice need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2

      # psibehavior is developed against psiexperiment's main branch (e.g.,
      # the tests rely on the context evaluating expressions when changes
      # are applied). Installing it first means installing psibehavior below
      # finds it already satisfied.
      - name: Install psiexperiment from main
        run: python -m pip install "psiexperiment @ git+https://github.com/psiexperiment/psiexperiment.git@main"

      - name: Install psibehavior and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Show the psiexperiment being tested
        run: python -m pip show psiexperiment

      - name: Run tests
        run: python -m pytest
